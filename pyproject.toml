[project]
name = "upbank-mcp"
version = "0.1.0"
description = "FastMCP server for the Up Banking API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.10",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tzdata>=2024.1",
]

[project.scripts]
upbank-mcp = "upbank_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upbank_mcp"]
